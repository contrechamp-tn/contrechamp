# Configuration du paquet. Le projet est en phase de conception.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "contrechamp"
version = "0.0.0"
description = "Le co-auteur qui ne tient jamais le stylo : une IA socratique pour les jeunes cinéastes tunisiens."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"contrechamp.socratique" = ["prompts/*.md"]

[tool.pytest.ini_options]
# Permet de lancer les tests sans installer le paquet.
pythonpath = ["src"]
testpaths = ["tests"]
